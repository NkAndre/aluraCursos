
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confere Aí — Mitos e Verdades</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <h1>Confere <span>Aí</span></h1>
        </div>

        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>

        <section class="introducao">
            <h2>Descubra a verdade</h2>
            <p>Passe o mouse sobre o cartão para revelar a resposta.</p>
        </section>

        <section class="flashcards">

            <article class="cartao">

                <div class="cartao-conteudo">

                    <!-- Frente -->
                    <div class="cartao-face cartao-averso">

                        <img
                            src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/mm1012723121410486.jpg?w=1900&h=2849"
                            alt="Pinguim"
                            class="cartao-imagem"
                        >

                        <span class="etiqueta">MITO</span>

                        <p>
                            Pinguins conseguem voar como pássaros!
                        </p>

                        <small>Passe o mouse ↻</small>

                    </div>

                    <!-- Verso -->
                    <div class="cartao-face cartao-verso">

                        <img
                            src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/mm1012723121410486.jpg?w=1900&h=2849"
                            alt="Pinguim"
                            class="cartao-imagem"
                        >

                        <span class="etiqueta verdade">VERDADE</span>

                        <p>
                            Pinguins não voam, mas são excelentes nadadores.
                        </p>

                    </div>

                </div>

            </article>

        </section>

    </main>

    <footer>
        <p>Projeto feito por <strong>André</strong> </p>
    </footer>

</body>

</html>
